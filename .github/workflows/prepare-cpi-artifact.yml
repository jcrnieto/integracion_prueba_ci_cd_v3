name: Prepare CPI Artifact

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.CPI_STRUCTURE_PAT }}
          fetch-depth: 0

      - name: Prepare artifact structure
        shell: bash
        run: |
          set -e

          FLOW_DIR="integracion_prueba_ci_cd_v3"

          echo "Buscando carpeta generada por CPI: $FLOW_DIR"

          if [ ! -d "$FLOW_DIR" ]; then
            echo "No existe $FLOW_DIR. No hay nada que procesar."
            exit 0
          fi

          echo "Carpeta encontrada. Corrigiendo estructura..."

          # Eliminar una estructura anterior en raíz, si existiera
          rm -rf META-INF
          rm -rf src
          rm -f .project
          rm -f metainfo.prop

          # Copiar el contenido generado por CPI a la raíz
          cp -a "$FLOW_DIR"/. .

          # Eliminar la carpeta contenedora creada por CPI
          rm -rf "$FLOW_DIR"

          # Limpiar archivos generados por macOS
          find . -name ".DS_Store" -delete

          echo "Estructura preparada:"
          find . -maxdepth 3 -type f | sort

      - name: Publish deploy branch
        shell: bash
        run: |
          set -e

          git config user.name "CPI CI/CD Bot"
          git config user.email "cpi-cicd-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios en el artefacto."
          else
            git commit -m "Prepare CPI artifact for deployment"
          fi

          git push origin HEAD:deploy --force
