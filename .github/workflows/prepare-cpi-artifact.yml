name: Prepare CPI Artifact

on:
  push:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.CPI_STRUCTURE_PAT }}
          fetch-depth: 0

      - name: Prepare clean deploy branch
        shell: bash
        run: |
          set -e

          FLOW_DIR="integracion_prueba_ci_cd_v3"

          echo "Verificando artefacto CPI..."

          if [ ! -d "$FLOW_DIR" ]; then
            echo "ERROR: No existe la carpeta $FLOW_DIR"
            exit 1
          fi

          echo "Guardando temporalmente el contenido del iFlow..."

          TMP_DIR="$(mktemp -d)"
          cp -a "$FLOW_DIR"/. "$TMP_DIR"/

          find "$TMP_DIR" -name ".DS_Store" -delete

          echo "Cambiando a la rama deploy existente..."

          git fetch origin deploy
          git checkout deploy
          git reset --hard origin/deploy

          echo "Limpiando contenido anterior de deploy..."

          git rm -rf . || true
          git clean -fdx

          echo "Copiando nueva versión del iFlow..."

          cp -a "$TMP_DIR"/. .

          echo "Contenido final:"
          find . -maxdepth 4 -type f | sort

          if [ ! -f "META-INF/MANIFEST.MF" ]; then
            echo "ERROR: No existe META-INF/MANIFEST.MF"
            exit 1
          fi

          git config user.name "CPI CI/CD Bot"
          git config user.email "cpi-cicd-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No hay cambios para actualizar en deploy."
            exit 0
          fi

          git commit -m "Prepare clean CPI artifact for deployment"

          git push origin deploy
