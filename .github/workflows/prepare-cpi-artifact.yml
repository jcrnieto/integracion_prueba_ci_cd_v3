name: Prepare CPI Artifact

on:
  push:
    branches:
      - main

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.CPI_STRUCTURE_PAT }}
          fetch-depth: 0

      - name: Prepare clean deploy branch
        shell: bash
        run: |
          set -e

          FLOW_DIR="integracion_prueba_ci_cd_v3"

          echo "Verificando artefacto CPI..."

          if [ ! -d "$FLOW_DIR" ]; then
            echo "No existe la carpeta $FLOW_DIR"
            exit 1
          fi

          echo "Guardando temporalmente el contenido del iFlow..."

          TMP_DIR="$(mktemp -d)"
          cp -a "$FLOW_DIR"/. "$TMP_DIR"/

          echo "Creando rama deploy limpia..."

          git checkout --orphan deploy-temp

          # Vaciar completamente la nueva rama
          git rm -rf . || true

          # Copiar solamente el contenido real del iFlow
          cp -a "$TMP_DIR"/. .

          # Limpiar archivos no deseados
          find . -name ".DS_Store" -delete

          echo "Contenido final:"
          find . -maxdepth 4 -type f | sort

          # Validación importante
          if [ ! -f "META-INF/MANIFEST.MF" ]; then
            echo "ERROR: No existe META-INF/MANIFEST.MF"
            exit 1
          fi

          git config user.name "CPI CI/CD Bot"
          git config user.email "cpi-cicd-bot@users.noreply.github.com"

          git add -A
          git commit -m "Prepare clean CPI artifact for deployment"

          git push origin HEAD:deploy --force
